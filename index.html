<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<title>WebGPU Crowd Stress Test</title>
	<meta name="description" content="Three.js r186 WebGPU mass-crowd stress test: low-poly GPU-simulated crowds, isometric camera, toggleable shader features with cost notes, Rapier physics.">
	<style>
		:root {
			--bg: rgba(14, 17, 23, 0.86);
			--bg2: rgba(255, 255, 255, 0.06);
			--fg: #e6edf3;
			--dim: #8b949e;
			--accent: #ffd23f;
			--good: #7ee787;
			--ok: #ffb454;
			--bad: #ff6b6b;
			--line: rgba(255, 255, 255, 0.1);
			--field: #1b2230;
			--field-line: #3a4458;
			color-scheme: dark;
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; color: var(--fg); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
		#app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
		button, select, input { font: inherit; color: inherit; }

		/* HUD */
		#hud { position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 210px; max-width: min(92vw, 380px); backdrop-filter: blur(6px); cursor: pointer; user-select: none; z-index: 5; font-variant-numeric: tabular-nums; }
		#hud .fps { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
		#hud .fps small { font-size: 13px; font-weight: 400; color: var(--dim); }
		#hud .good { color: var(--good); } #hud .ok { color: var(--ok); } #hud .bad { color: var(--bad); }
		#hud .dim { color: var(--dim); }
		#hud .more { display: none; margin-top: 4px; }
		#hud.expanded .more { display: block; }
		#graph { width: 100%; height: 36px; display: block; margin-top: 6px; }
		#hud .legend { font-size: 11px; color: var(--dim); }
		#warnings { position: fixed; left: 50%; transform: translateX(-50%); top: max(8px, env(safe-area-inset-top)); max-width: min(90vw, 520px); background: rgba(80, 50, 0, 0.9); border: 1px solid #b07a00; color: #ffe2a0; padding: 6px 10px; border-radius: 8px; font-size: 12px; display: none; z-index: 6; }

		/* Panel */
		#panel-toggle { position: fixed; right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); z-index: 11; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; cursor: pointer; }
		#panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(400px, 100vw); background: var(--bg); border-left: 1px solid var(--line); transform: translateX(105%); transition: transform .2s ease; z-index: 10; display: flex; flex-direction: column; backdrop-filter: blur(8px); }
		#panel.open { transform: none; }
		#panel header { padding: 14px 60px 8px 14px; border-bottom: 1px solid var(--line); }
		#panel header h1 { font-size: 15px; margin: 0; }
		#panel header p { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
		#panel-body { overflow-y: auto; padding: 6px 10px 80px; -webkit-overflow-scrolling: touch; }
		.section { border-bottom: 1px solid var(--line); }
		.section-title { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 2px; font-weight: 600; cursor: pointer; }
		.section-title::after { content: "▸"; float: right; color: var(--dim); }
		.section.open .section-title::after { content: "▾"; }
		.section-title.static::after { content: ""; }
		.section-body { display: none; padding-bottom: 8px; }
		.section.open .section-body { display: block; }
		.row { display: grid; grid-template-columns: 1fr minmax(110px, 46%); align-items: center; gap: 6px; padding: 4px 0; }
		.row.item { grid-template-columns: 1fr minmax(110px, 44%) auto auto; }
		.row label { color: var(--fg); }
		.ctrl { display: flex; align-items: center; gap: 6px; min-width: 0; }
		.ctrl select, .row > select { width: 100%; min-width: 0; background: var(--field); color: var(--fg); border: 1px solid var(--field-line); border-radius: 6px; padding: 5px 6px; color-scheme: dark; }
		/* Native dropdown lists can't use a translucent background: give options opaque colours
		   explicitly, otherwise Windows / Android paint light text on a white popup. */
		select option, select optgroup { background: var(--field); color: var(--fg); }
		select option:checked { background: #2b3445; color: #ffffff; }
		select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
		.ctrl input[type=range] { width: 100%; min-width: 0; accent-color: var(--accent); }
		.ctrl input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
		.value { color: var(--dim); font-size: 11px; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
		.cost { font-size: 8px; letter-spacing: 1px; white-space: nowrap; }
		.cost0, .cost1 { color: var(--good); } .cost2 { color: #e3d354; } .cost3 { color: var(--ok); } .cost4 { color: var(--bad); }
		.info-btn { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 15px; padding: 0 2px; }
		.info { display: none; grid-column: 1 / -1; background: var(--bg2); border-radius: 6px; padding: 6px 8px; color: #c9d1d9; font-size: 12px; }
		.info > div + div { margin-top: 4px; }
		.info .mobile { color: #a5d6ff; }
		.show-info .info { display: block; }
		.presets { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; }
		.chip { background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
		.chip:active, .chip.on { background: var(--accent); color: #111; }
		.hint { color: var(--dim); font-size: 12px; margin: 4px 0; }
		.bench-out { font-size: 12px; margin-top: 6px; overflow-x: auto; }
		.bench-out table { width: 100%; border-collapse: collapse; margin-top: 4px; }
		.bench-out td, .bench-out th { text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); }
		.bench-out td:nth-child(n+2), .bench-out th:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
		.bench-out pre, .bench-out textarea { width: 100%; max-height: 180px; overflow: auto; white-space: pre-wrap; font-size: 11px; background: var(--bg2); padding: 6px; border-radius: 6px; }
		.bench-out textarea { height: 180px; }

		/* Touch controls */
		#touch { display: none; }
		body.touch #touch { display: block; }
		#joystick { position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); z-index: 4; touch-action: none; }
		#knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255, 210, 63, 0.8); pointer-events: none; }
		#actions { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, 58px); gap: 10px; z-index: 4; }
		#actions button { width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); background: rgba(14,17,23,0.7); font-size: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
		#actions button.on { background: var(--accent); color: #111; }
		#claude-link { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--dim); z-index: 4; pointer-events: none; }
		body.touch #claude-link { left: 50%; transform: translateX(-50%); bottom: max(2px, env(safe-area-inset-bottom)); }
		#cam-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 6px; z-index: 4; }
		#cam-bar button { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-width: 40px; height: 36px; cursor: pointer; }
		body.touch #cam-bar { bottom: auto; top: max(60px, env(safe-area-inset-top)); left: auto; right: max(8px, env(safe-area-inset-right)); transform: none; flex-direction: column; }

		body.hide-ui #hud, body.hide-ui #panel, body.hide-ui #cam-bar, body.hide-ui #warnings, body.hide-ui #panel-toggle { display: none !important; }

		#fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: #0d1117; z-index: 100; padding: 24px; text-align: center; }
		#fatal .detail { white-space: pre-wrap; color: var(--dim); max-width: 640px; }

		@media (max-width: 899px) {
			#panel { top: auto; height: 62vh; width: 100vw; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; transform: translateY(105%); }
			#panel.open { transform: none; }
			#hud { font-size: 11px; min-width: 0; max-width: 62vw; padding: 6px 8px; }
			#hud .fps { font-size: 22px; }
			#hud:not(.expanded) .x, #hud:not(.expanded) .legend { display: none; }
			#graph { height: 24px; }
		}
	</style>
</head>
<body>
	<div id="app"></div>

	<div id="hud" title="Tap for more">
		<div id="hud-body">starting WebGPU…</div>
		<canvas id="graph" width="240" height="36"></canvas>
		<div class="legend"><span style="color:#7ee787">■</span> frame ms <span style="color:#ffb454">■</span> GPU ms · lines at 16.7 / 33.3 ms</div>
	</div>
	<div id="warnings"></div>

	<button id="panel-toggle" title="Settings (P)">⚙</button>
	<aside id="panel">
		<header>
			<h1>WebGPU Crowd Stress Test</h1>
			<p>three.js r186 · WebGPU only · compute-driven crowd</p>
		</header>
		<div id="panel-body"></div>
	</aside>

	<div id="cam-bar">
		<button data-action="rotL" title="Rotate (Q)">⟲</button>
		<button data-action="recenter" title="Recenter (C)">◎</button>
		<button data-action="rotR" title="Rotate (E)">⟳</button>
		<button data-action="zoomIn" title="Zoom in (+)">＋</button>
		<button data-action="zoomOut" title="Zoom out (−)">－</button>
	</div>

	<div id="touch">
		<div id="joystick"><div id="knob"></div></div>
		<div id="actions">
			<button data-action="wave">Wave</button>
			<button data-action="run">Run</button>
			<button data-action="cheer">Cheer</button>
			<button data-action="dance">Dance</button>
		</div>
	</div>

	<div id="fatal"><h2></h2><div class="detail"></div></div>

	<script type="module" src="/src/main.js"></script>
</body>
</html>
