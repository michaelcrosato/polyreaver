<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<title>Polyreaver</title>
	<style>
		:root {
			--bg: rgba(14, 16, 22, 0.86); --bg2: rgba(26, 30, 40, 0.94); --line: rgba(255, 255, 255, 0.14);
			--fg: #eef1f6; --dim: #a9b1c2; --accent: #ffcf5a; --life: #d83a3a; --mana: #3a7bd8; --xp: #c9a227;
			--good: #6fe08a; --bad: #ff6b6b; --magic: #7aa7ff; --rare: #ffe066; --unique: #ff9a3c; --set: #6fe08a;
			--field: #1b2230; --field-line: #3a4458;
			font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color-scheme: dark;
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; overflow: hidden; background: #07080b; color: var(--fg); touch-action: none; user-select: none; -webkit-user-select: none; }
		#game { position: fixed; inset: 0; }
		#game canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
		#ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
		#ui .panel, #ui button, #ui input, #ui select, #ui .interactive { pointer-events: auto; }
		.panel { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
		button { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--field-line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
		button:hover { border-color: var(--accent); }
		select, input[type=number] { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 3px 6px; color-scheme: dark; }
		select option { background: var(--field); color: var(--fg); }
		h2, h3 { margin: 0 0 8px; }
		.dim { color: var(--dim); }
		.hidden { display: none !important; }
		#fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #07080b; z-index: 50; padding: 24px; }
		#fatal .panel { max-width: 560px; white-space: pre-wrap; }
	</style>
</head>
<body>
	<div id="game"></div>
	<div id="ui"></div>
	<div id="fatal"><div class="panel"><h2></h2><div class="detail"></div></div></div>
	<script type="module" src="./src/game/main.js"></script>
</body>
</html>
