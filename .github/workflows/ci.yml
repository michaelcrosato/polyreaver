# Runs on every push: lint, both builds and a short headless game simulation (a
# couple of minutes). The built single-file HTMLs are attached to the run so they
# can be downloaded from the Actions tab.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:game
      - name: Check the committed single-file builds are current
        run: |
          for f in webgpu-crowd-stress.html polyreaver.html; do
            if ! git diff --quiet -- "$f"; then
              echo "::warning file=$f::The committed $f is older than the source. Rebuild and commit it."
            fi
          done
      # the real game simulation in Node (no GPU): crashes in any feature fail the build
      - run: npm run sim -- --depth 1-4 --seconds 45
      - run: npm run sim -- --depth 25 --seconds 30
      - uses: actions/upload-artifact@v4
        with:
          name: webgpu-crowd-stress
          path: webgpu-crowd-stress.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: polyreaver
          path: polyreaver.html
          retention-days: 30
