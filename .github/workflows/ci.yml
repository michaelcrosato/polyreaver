# Runs on every push: lint, city validation, all builds, boot browser checks,
# and a short headless game simulation. Downloads include standalone HTMLs.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:city
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:boot
      - run: npm run smoke:city-options -- --quick
      - name: Check the committed single-file builds are current
        run: |
          for f in webgpu-crowd-stress.html polyreaver.html city-demo.html classic-crowd.html; do
            if ! git diff --quiet -- "$f"; then
              echo "::warning file=$f::The committed $f is older than the source. Rebuild and commit it."
            fi
          done
      # the real game simulation in Node (no GPU): crashes in any feature fail the build
      - run: npm run sim -- --depth 1-4 --seconds 45
      - run: npm run sim -- --depth 25 --seconds 30
      - uses: actions/upload-artifact@v4
        with:
          name: webgpu-crowd-stress
          path: webgpu-crowd-stress.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: polyreaver
          path: polyreaver.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: polyreaver-city
          path: city-demo.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: classic-crowd
          path: classic-crowd.html
          retention-days: 30
